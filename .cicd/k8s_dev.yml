apiVersion: apps/v1 
kind: Deployment
metadata:
  name: chathura-eureka-dev
  labels:
    app: chathura-eureka-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chathura-eureka-dev
  template:
    metadata:
      labels:
        app: chathura-eureka-dev
    spec:
     imagePullSecrets:
     - name: jfrog-registry
     containers:
     - name: chathura-eureka-dev
       image: DIT
---
apiVersion: v1
kind: Service
metadata:
  name: chathura-eureka-dev 
  labels:
    app: chathura-eureka-dev
spec:
 #type: NodePort
 ports:
 - port: 80
   targetPort: 8761
 selector:
  app: chathura-eureka-dev

---
# Creating ingress controller
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chathura-eureka-dev-ingress
spec:
  rules:
  - host: eureka-dev.chathura.in
    http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: chathura-eureka-dev
            port:
              number: 80